name: elearningfrcpath_ios
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+15

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  connectivity_plus: ^6.0.0
  flutter_native_splash: ^2.4.3
  url_launcher: ^6.3.2
  webview_flutter_android: ^4.12.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  share_plus: ^10.0.0
  shared_preferences: ^2.3.0
  in_app_review: ^2.0.9
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1
  flutter_timezone: ^3.0.0
  workmanager: ^0.9.0
  add_2_calendar: ^3.0.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appIcon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#ffffff"
  image: assets/appIcon.png
  ios: true
  android: true
  web: false
  android_12:
    color: "#ffffff"
    image: assets/appIcon.png

flutter:
  uses-material-design: true

  assets:
    - assets/appIcon.png
