workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elearningfrcpath.ios
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Pod install
        script: cd ios && pod install
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            com.elearningfrcpath.ios \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
